[package]
name = "stimma-drawthings"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Stimma <stimmant@stimma.ai>"]
description = "Standalone Draw Things STP provider"
repository = "https://github.com/stimma-ai/stimma-drawthings"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flatbuffers = { version = "=25.12.19", features = ["serialize"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
prost = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time", "sync", "fs", "signal"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
fs2 = "0.4"
async-stream = "0.3"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
